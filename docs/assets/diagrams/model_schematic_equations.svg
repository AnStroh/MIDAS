<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" font-family="Arial, Helvetica, sans-serif">
  <!-- Technical variant of model_schematic.svg for docs/equations.md: same
       moving-boundary layout, annotated with the symbols equations.md
       actually uses (D^A, D^B, L = l_A+l_B, Da_A/Da_B, S(t)). -->
  <rect width="760" height="480" fill="white"/>

  <!-- Phase A block -->
  <rect x="60" y="70" width="280" height="90" fill="#2E1A47" fill-opacity="0.15" stroke="#2E1A47" stroke-width="1.5"/>
  <text x="200" y="105" text-anchor="middle" font-size="16" fill="#2E1A47" font-weight="bold">Phase A</text>
  <text x="200" y="126" text-anchor="middle" font-size="13" fill="#2E1A47">(crystal)</text>
  <text x="200" y="145" text-anchor="middle" font-size="13" fill="#2E1A47" font-style="italic">D<tspan dy="-4" font-size="9">A</tspan></text>

  <!-- Phase B block -->
  <rect x="340" y="70" width="360" height="90" fill="#D9A441" fill-opacity="0.22" stroke="#B8842A" stroke-width="1.5"/>
  <text x="520" y="105" text-anchor="middle" font-size="16" fill="#8A6420" font-weight="bold">Phase B</text>
  <text x="520" y="126" text-anchor="middle" font-size="13" fill="#8A6420">(matrix)</text>
  <text x="520" y="145" text-anchor="middle" font-size="13" fill="#8A6420" font-style="italic">D<tspan dy="-4" font-size="9">B</tspan></text>

  <!-- Interface line, with interface kinetics (Damkohler) note -->
  <line x1="340" y1="63" x2="340" y2="167" stroke="#3E8F7C" stroke-width="3"/>
  <text x="340" y="53" text-anchor="middle" font-size="14" font-style="italic" fill="#3E8F7C">S(t)</text>
  <text x="400" y="190" font-size="12.5" fill="#3E8F7C" font-style="italic">Da<tspan dy="3" font-size="8.5">A</tspan><tspan dy="-3" font-style="normal">, </tspan><tspan font-style="italic">Da</tspan><tspan dy="3" font-size="8.5">B</tspan><tspan dy="-3" font-style="normal" font-size="11.5"> (interface kinetics, </tspan><tspan font-style="italic">k</tspan><tspan dy="3" font-size="8">A</tspan><tspan dy="-3" font-style="normal" font-size="11.5">, </tspan><tspan font-style="italic">k</tspan><tspan dy="3" font-size="8">B</tspan><tspan dy="-3" font-style="normal" font-size="11.5">)</tspan></text>

  <!-- L = l_A + l_B dimension bracket spanning the whole domain -->
  <line x1="60" y1="35" x2="60" y2="20" stroke="#555" stroke-width="1.3"/>
  <line x1="700" y1="35" x2="700" y2="20" stroke="#555" stroke-width="1.3"/>
  <line x1="60" y1="27" x2="700" y2="27" stroke="#555" stroke-width="1.3"/>
  <text x="380" y="18" text-anchor="middle" font-size="13" fill="#555"><tspan font-style="italic">L = l</tspan><tspan dy="3" font-size="9" font-style="italic">A</tspan><tspan dy="-3" font-style="italic"> + l</tspan><tspan dy="3" font-size="9" font-style="italic">B</tspan></text>

  <!-- Growth/resorption arrow -->
  <path d="M340,185 l18,-10 l0,6 l20,0 l0,8 l-20,0 l0,6 Z" fill="#3E8F7C"/>
  <path d="M340,185 l-18,-10 l0,6 l-20,0 l0,8 l20,0 l0,6 Z" fill="#3E8F7C" fill-opacity="0.45"/>
  <text x="340" y="215" text-anchor="middle" font-size="12" fill="#3E8F7C">dS/dt (growth &#8596; resorption)</text>

  <!-- ===================== Concentration profile ===================== -->
  <text x="380" y="260" text-anchor="middle" font-size="16" font-weight="bold" fill="#2E1A47">Diffusion: &#8706;C/&#8706;t = &#8706;/&#8706;x(D &#8706;C/&#8706;x)</text>

  <line x1="60" y1="285" x2="60" y2="410" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="410" x2="700" y2="410" stroke="#333" stroke-width="1.5"/>
  <text x="38" y="290" font-size="16" font-style="italic" fill="#333">C</text>
  <text x="705" y="415" font-size="16" font-style="italic" fill="#333">x</text>

  <line x1="340" y1="285" x2="340" y2="410" stroke="#3E8F7C" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- C is discontinuous at the interface (C_A^int/C_B^int = K_D, generally
       != 1) - two separate paths, not one smooth curve; matches plotAB.m's
       own convention of plotting phase A and B as two distinct lines. -->
  <path d="M70,315 C150,315 250,313 310,318 C325,322 335,335 340,342"
        fill="none" stroke="#2E1A47" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M340,368 C345,375 355,379 370,382 C450,398 550,403 690,406"
        fill="none" stroke="#8A6420" stroke-width="3.5" stroke-linecap="round"/>

  <rect x="60" y="285" width="280" height="125" fill="#2E1A47" fill-opacity="0.05"/>
  <rect x="340" y="285" width="360" height="125" fill="#D9A441" fill-opacity="0.08"/>

  <text x="200" y="430" text-anchor="middle" font-size="13" fill="#2E1A47" font-style="italic">C<tspan dy="-5" font-size="9">A</tspan><tspan dy="5">(x,t)</tspan></text>
  <text x="520" y="430" text-anchor="middle" font-size="13" fill="#8A6420" font-style="italic">C<tspan dy="-5" font-size="9">B</tspan><tspan dy="5">(x,t)</tspan></text>

  <!-- Reaction/equilibrium note at the interface in the profile panel -->
  <text x="345" y="305" font-size="11.5" fill="#3E8F7C"><tspan font-style="italic">K</tspan><tspan dy="3" font-size="8" font-style="italic">D</tspan><tspan dy="-3" font-style="normal"> partitioning</tspan></text>
</svg>
