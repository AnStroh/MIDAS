<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 260" width="635" height="260">
  <!-- Dark-mode counterpart of midas_logo_horizontal.svg: transparent
       background instead of white, and every stroke/text color lightened so
       it stays legible on a dark page. Geometry is identical to the light
       version so the two can be swapped via a <picture>/prefers-color-scheme
       block without any layout shift. -->
  <defs>
    <linearGradient id="g1d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B9A6D9"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
  </defs>

  <!-- Left: composition profile -->
  <line x1="20" y1="40" x2="20" y2="160" stroke="#EAE3F2" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="20" y1="160" x2="140" y2="160" stroke="#EAE3F2" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M30,55 C60,60 75,85 90,105 C100,118 108,130 130,145"
        fill="none" stroke="#C9B6E3" stroke-width="5" stroke-linecap="round"/>
  <circle cx="30" cy="55" r="5" fill="#D9A441"/>
  <circle cx="130" cy="145" r="5" fill="#D9A441"/>
  <text x="6" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#EAE3F2" fill-opacity="0.85">C</text>
  <text x="145" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#EAE3F2" fill-opacity="0.85">x</text>

  <!-- Wordmark (centered, equal 55px gap to each diagram) -->
  <text x="195" y="145" font-family="Arial, Helvetica, sans-serif" font-size="72"
        font-weight="bold" fill="#F3ECFB" letter-spacing="3">MIDAS</text>

  <!-- Right: apparent-age profile (flat core, resets near rim) -->
  <line x1="495" y1="40" x2="495" y2="160" stroke="#EAE3F2" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="495" y1="160" x2="615" y2="160" stroke="#EAE3F2" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M505,60 L560,62 C575,64 585,85 593,105 C598,118 601,130 605,145"
        fill="none" stroke="#6FCBB0" stroke-width="5" stroke-linecap="round"/>
  <circle cx="505" cy="60" r="5" fill="#D9A441"/>
  <circle cx="605" cy="145" r="5" fill="#D9A441"/>
  <text x="469" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#EAE3F2" fill-opacity="0.85">&#964;</text>
  <text x="623" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#EAE3F2" fill-opacity="0.85">x</text>

  <!-- Gradient underline spanning the whole lockup -->
  <rect x="20" y="205" width="595" height="8" fill="url(#g1d)"/>
</svg>
