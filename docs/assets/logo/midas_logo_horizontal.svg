<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 260" width="635" height="260">
  <!-- MIDAS wordmark, flanked by two small schematic diagrams: left = a
       composition (concentration vs. distance) profile, core-to-rim; right =
       an apparent-age profile, flat in the preserved core and dropping off
       near the diffusively-reset rim - the two diagnostics this app centers
       on (diffusion profiles + diffusion chronology). Axis labels: x =
       distance, C = concentration, tau = apparent age (matches this
       codebase's own notation for it, e.g. plot_velocity_age.m). Layout is
       symmetric: equal margins left/right, equal gap on both sides of the
       wordmark. -->
  <rect width="635" height="260" fill="white"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E1A47"/>
      <stop offset="1" stop-color="#D9A441"/>
    </linearGradient>
  </defs>

  <!-- Left: composition profile -->
  <line x1="20" y1="40" x2="20" y2="160" stroke="#2E1A47" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="20" y1="160" x2="140" y2="160" stroke="#2E1A47" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M30,55 C60,60 75,85 90,105 C100,118 108,130 130,145"
        fill="none" stroke="#2E1A47" stroke-width="5" stroke-linecap="round"/>
  <circle cx="30" cy="55" r="5" fill="#D9A441"/>
  <circle cx="130" cy="145" r="5" fill="#D9A441"/>
  <text x="6" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#2E1A47" fill-opacity="0.8">C</text>
  <text x="145" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#2E1A47" fill-opacity="0.8">x</text>

  <!-- Wordmark (centered, equal 55px gap to each diagram) -->
  <text x="195" y="145" font-family="Arial, Helvetica, sans-serif" font-size="72"
        font-weight="bold" fill="#2E1A47" letter-spacing="3">MIDAS</text>

  <!-- Right: apparent-age profile (flat core, resets near rim) -->
  <line x1="495" y1="40" x2="495" y2="160" stroke="#2E1A47" stroke-opacity="0.25" stroke-width="2"/>
  <line x1="495" y1="160" x2="615" y2="160" stroke="#2E1A47" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M505,60 L560,62 C575,64 585,85 593,105 C598,118 601,130 605,145"
        fill="none" stroke="#3E8F7C" stroke-width="5" stroke-linecap="round"/>
  <circle cx="505" cy="60" r="5" fill="#D9A441"/>
  <circle cx="605" cy="145" r="5" fill="#D9A441"/>
  <text x="469" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#2E1A47" fill-opacity="0.8">&#964;</text>
  <text x="623" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="18"
        font-style="italic" fill="#2E1A47" fill-opacity="0.8">x</text>

  <!-- Gradient underline spanning the whole lockup -->
  <rect x="20" y="205" width="595" height="8" fill="url(#g1)"/>
</svg>
